<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" preserveAspectRatio="xMidYMid meet">
  <defs>
<!--Background gradient - slate/gray theme-->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a; stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1e293b; stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#334155; stop-opacity:1"/>
    </linearGradient>
<!--subtle center halo - slate theme-->
    <radialGradient id="trophyHalo" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#64748b; stop-opacity:0.3"/>
      <stop offset="35%" style="stop-color:#475569; stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#334155; stop-opacity:0.1"/>
    </radialGradient>
<!--small subtle glow for elements - slate theme-->
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
<!--Slate-themed rectangles-->
    <linearGradient id="rectFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569; stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#64748b; stop-opacity:0.6"/>
    </linearGradient>
    <style>
      <![CDATA[
      .box { fill: url(#rectFill); stroke: rgba(203,213,225,0.7); stroke-width:2; rx:6; }
      .connector { fill:none; stroke: rgba(203,213,225,0.8); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .connector-faint { fill:none; stroke: rgba(203,213,225,0.4); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
      .title { font-family: Arial, Helvetica, sans-serif; font-weight:700; fill:#f8fafc; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    ]]>
    </style>
  </defs>
<!--Background-->
  <rect width="100%" height="100%" fill="url(#bgGradient)"/>
<!--LEFT SIDE: 4 top + 4 bottom-->
<!--Round 1 (left)-->
  <g id="left-round1">
    <rect class="box" x="60" y="90" width="140" height="40"/>
    <rect class="box" x="60" y="150" width="140" height="40"/>
    <rect class="box" x="60" y="210" width="140" height="40"/>
    <rect class="box" x="60" y="270" width="140" height="40"/>
    <rect class="box" x="60" y="470" width="140" height="40"/>
    <rect class="box" x="60" y="530" width="140" height="40"/>
    <rect class="box" x="60" y="590" width="140" height="40"/>
    <rect class="box" x="60" y="650" width="140" height="40"/>
  </g>
<!--LEFT ROUND 2-->
  <g id="left-round2">
    <rect class="box" x="280" y="120" width="140" height="40"/>
    <rect class="box" x="280" y="240" width="140" height="40"/>
    <rect class="box" x="280" y="500" width="140" height="40"/>
    <rect class="box" x="280" y="620" width="140" height="40"/>
  </g>
<!--LEFT ROUND 3-->
  <g id="left-round3">
    <rect class="box" x="500" y="180" width="140" height="40"/>
    <rect class="box" x="500" y="560" width="140" height="40"/>
  </g>
<!--RIGHT SIDE (mirrored left)-->
<!--Round 1 (right)-->
  <g id="right-round1">
    <rect class="box" x="1200" y="90" width="140" height="40"/>
    <rect class="box" x="1200" y="150" width="140" height="40"/>
    <rect class="box" x="1200" y="210" width="140" height="40"/>
    <rect class="box" x="1200" y="270" width="140" height="40"/>
    <rect class="box" x="1200" y="470" width="140" height="40"/>
    <rect class="box" x="1200" y="530" width="140" height="40"/>
    <rect class="box" x="1200" y="590" width="140" height="40"/>
    <rect class="box" x="1200" y="650" width="140" height="40"/>
  </g>
<!--RIGHT ROUND 2-->
  <g id="right-round2">
    <rect class="box" x="980" y="120" width="140" height="40"/>
    <rect class="box" x="980" y="240" width="140" height="40"/>
    <rect class="box" x="980" y="500" width="140" height="40"/>
    <rect class="box" x="980" y="620" width="140" height="40"/>
  </g>
<!--RIGHT ROUND 3-->
  <g id="right-round3">
    <rect class="box" x="760" y="180" width="140" height="40"/>
    <rect class="box" x="760" y="560" width="140" height="40"/>
  </g>
<!--FINALS-->
  <g id="finals">
    <rect class="box" x="620" y="380" width="160" height="40"/>
  </g>
<!--CONNECTORS - LEFT (top pair, second pair, bottom pairs)-->
  <g id="connectors-left" stroke-linecap="round" stroke-linejoin="round">
<!--Round1 -> Round2 (top four)-->
    <polyline class="connector" points="200,110 240,110 240,140 280,140"/>
    <polyline class="connector" points="200,170 240,170 240,140 280,140"/>
    <polyline class="connector" points="200,230 240,230 240,260 280,260"/>
    <polyline class="connector" points="200,290 240,290 240,260 280,260"/>
<!--Round1 -> Round2 (bottom four)-->
    <polyline class="connector" points="200,490 240,490 240,520 280,520"/>
    <polyline class="connector" points="200,550 240,550 240,520 280,520"/>
    <polyline class="connector" points="200,610 240,610 240,640 280,640"/>
    <polyline class="connector" points="200,670 240,670 240,640 280,640"/>
<!--Round2 -> Round3 (top)-->
    <polyline class="connector" points="420,140 460,140 460,200 500,200"/>
    <polyline class="connector" points="420,260 460,260 460,200 500,200"/>
<!--Round2 -> Round3 (bottom)-->
    <polyline class="connector" points="420,520 460,520 460,580 500,580"/>
    <polyline class="connector" points="420,640 460,640 460,580 500,580"/>
<!--Round3 -> Finals (left side)-->
    <polyline class="connector" points="640,200 680,200 680,400 620,400"/>
    <polyline class="connector" points="640,580 680,580 680,400 620,400"/>
  </g>
<!--CONNECTORS - RIGHT (mirror of left; calculated by x' = 1400 - x)-->
  <g id="connectors-right" stroke-linecap="round" stroke-linejoin="round">
<!--Round1 -> Round2 (top)-->
    <polyline class="connector" points="1200,110 1160,110 1160,140 1120,140"/>
    <polyline class="connector" points="1200,170 1160,170 1160,140 1120,140"/>
    <polyline class="connector" points="1200,230 1160,230 1160,260 1120,260"/>
    <polyline class="connector" points="1200,290 1160,290 1160,260 1120,260"/>
<!--bottom-->
    <polyline class="connector" points="1200,490 1160,490 1160,520 1120,520"/>
    <polyline class="connector" points="1200,550 1160,550 1160,520 1120,520"/>
    <polyline class="connector" points="1200,610 1160,610 1160,640 1120,640"/>
    <polyline class="connector" points="1200,670 1160,670 1160,640 1120,640"/>
<!--Round2 -> Round3-->
    <polyline class="connector" points="980,140 940,140 940,200 900,200"/>
    <polyline class="connector" points="980,260 940,260 940,200 900,200"/>
    <polyline class="connector" points="980,520 940,520 940,580 900,580"/>
    <polyline class="connector" points="980,640 940,640 940,580 900,580"/>
<!--Round3 -> Finals (right side)-->
    <polyline class="connector" points="760,200 720,200 720,400 780,400"/>
    <polyline class="connector" points="760,580 720,580 720,400 780,400"/>
  </g>
<!--CENTER TROPHY + SLATE-THEMED HALO-->
  <g id="center-trophy">
<!--Halo (soft, subtle slate gradient)-->
    <circle cx="700" cy="400" r="120" fill="url(#trophyHalo)" opacity="0.6"/>
<!--blurred rings for gentle slate glow-->
    <circle cx="700" cy="400" r="140" fill="none" stroke="#64748b" stroke-width="12" opacity="0.15" filter="url(#blurGlow)"/>
    <circle cx="700" cy="400" r="160" fill="none" stroke="#475569" stroke-width="16" opacity="0.08" filter="url(#blurGlow)"/>
<!--Simple trophy icon in slate theme-->
    <g transform="translate(680,380)" fill="none" stroke="rgba(248,250,252,0.8)" stroke-width="2">
      <path d="M10,8 q0,16 20,16 q20,0 20,-16 v-24 h-40 z" fill="rgba(100,116,139,0.3)" stroke="rgba(203,213,225,0.7)"/>
      <path d="M8,-2 q-8,-2 -8,6 q6,4 8,4" stroke="rgba(203,213,225,0.5)" fill="none"/>
      <path d="M52,-2 q8,-2 8,6 q-6,4 -8,4" stroke="rgba(203,213,225,0.5)" fill="none"/>
      <!-- base -->
      <rect x="22" y="28" width="16" height="4" rx="2" fill="rgba(100,116,139,0.4)"/>
      <rect x="16" y="34" width="28" height="6" rx="3" fill="rgba(71,85,105,0.3)"/>
    </g>
  </g>
<!--Title-->
  <text x="700" y="48" text-anchor="middle" class="title" font-size="32">TOURNAMENT BRACKET</text>
</svg>
